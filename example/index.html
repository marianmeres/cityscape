<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- `viewport-fit=cover` lets the canvas reach under the notch; the chrome reads the
		     safe-area insets so nothing important hides there. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<title>@marianmeres/cityscape — three worlds on one engine</title>
		<meta
			name="description"
			content="An installable demo: a night city skyline, a sunlit nature valley and a polyomino puzzle — three worlds on one headless engine with a swappable Canvas · ASCII · Pixel renderer seam."
		/>

		<!-- PWA / installability. The router rewrites theme-color per world. -->
		<link rel="manifest" href="./manifest.webmanifest" />
		<meta name="theme-color" content="#0a0f1e" />
		<meta name="color-scheme" content="dark light" />

		<!-- iOS home-screen app: run standalone (no Safari chrome), drawing under the
		     translucent status bar for an edge-to-edge full-screen feel. -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Cityscape" />
		<link rel="apple-touch-icon" href="./icons/apple-touch-180.png" />

		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌃</text></svg>"
		/>
		<link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />

		<!-- Panel theme tokens (scoped per [data-world]) + the app/chooser/chrome styles. -->
		<link rel="stylesheet" href="./theme/tokens.css" />
		<link rel="stylesheet" href="./app.css" />
	</head>
	<body>
		<!--
			The single SPA mount point. main.ts renders the chooser (#/) or a world stage
			(#/city · #/nature · #/shapes) into it, swapping client-side. Build the bundle first:
			  deno task example:build      (or example:watch)
		-->
		<div id="app"></div>
		<script type="module" src="./dist/bundle.js"></script>
	</body>
</html>
